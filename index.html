<!doctype html>
<html lang="en">
  <head>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8" />
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        33% { transform: translateY(-20px) rotate(5deg); }
        66% { transform: translateY(-10px) rotate(-5deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(12deg); }
        50% { transform: translateY(-30px) rotate(20deg); }
      }
      @keyframes drift {
        0%, 100% { transform: translateX(0px) rotate(-6deg); }
        50% { transform: translateX(20px) rotate(6deg); }
      }
      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes blobPulse {
        0%, 100% { transform: scale(1); opacity: 0.15; }
        50% { transform: scale(1.3); opacity: 0.25; }
      }
      .animate-float { animation: float 6s ease-in-out infinite; }
      .animate-float2 { animation: float2 8s ease-in-out infinite; }
      .animate-drift { animation: drift 7s ease-in-out infinite; }
      .animate-gradient {
        background-size: 200% 200%;
        animation: gradientShift 8s ease infinite;
      }
      .animate-blob { animation: blobPulse 4s ease-in-out infinite; }
      .animate-blob-delay { animation: blobPulse 4s ease-in-out infinite 2s; }
      .animate-spin-slow { animation: spinSlow 20s linear infinite; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>moje-schronisko</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
